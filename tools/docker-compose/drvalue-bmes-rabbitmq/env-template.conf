# .env

# 공통 RabbitMQ 환경 변수
RABBITMQ_ERLANG_COOKIE=<RABBITMQ 쿠키 비밀번호>
RABBITMQ_DEFAULT_USER=backend_user
RABBITMQ_DEFAULT_PASS=<RABBITMQ 비밀번호>


# 각 노드별 포트 매핑
# rabbitmq1
RABBITMQ1_MANAGEMENT_PORT=15672
RABBITMQ1_AMQP_PORT=5672

# rabbitmq2
RABBITMQ2_MANAGEMENT_PORT=15673
RABBITMQ2_AMQP_PORT=5673

# rabbitmq3
RABBITMQ3_MANAGEMENT_PORT=15674
RABBITMQ3_AMQP_PORT=5674