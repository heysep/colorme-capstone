  redisnode5:
    image: docker.io/bitnamilegacy/redis-cluster:7.4
    container_name: drvalue_bmes_redis_node_5
    depends_on:
      - redisnode0
      - redisnode1
      - redisnode2
      - redisnode3
      - redisnode4
    volumes:
      - ./data_mnt_redis/data/node-5:/bitnami/redis/data
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_NODES: 'redisnode0 redisnode1 redisnode2 redisnode3 redisnode4 redisnode5'
      REDIS_CLUSTER_DYNAMIC_IPS: 'yes'
      REDIS_CLUSTER_PREFERRED_ENDPOINT_TYPE: 'hostname'
      REDIS_CLUSTER_ANNOUNCE_HOSTNAME: 'redisnode5'
      REDIS_CLUSTER_ANNOUNCE_PORT: '6379'
      REDIS_CLUSTER_ANNOUNCE_BUS_PORT: '16379'
      REDISCLI_AUTH: ${REDIS_PASSWORD}
      REDIS_CLUSTER_REPLICAS: '1'
      REDIS_CLUSTER_CREATOR: 'yes'
      REDIS_EXTRA_FLAGS: '--maxmemory ${REDIS_MAX_MEMORY} --maxmemory-policy volatile-ttl'
    ports:
      - '${REDIS_PORT_5}:6379'
      - '${REDIS_PORT_5}1:16379'
    healthcheck:
      test: [
          'CMD-SHELL',
          "/opt/bitnami/redis/bin/redis-cli --no-auth-warning -h 127.0.0.1 -p 6379 -a \"$REDIS_PASSWORD\" cluster info \
          | tr -d '\\r' | tee /tmp/ci && \
          awk -F: '/^cluster_state:/{print $2}' /tmp/ci | grep -qx ok && \
          awk -F: '/^cluster_known_nodes:/{print $2}' /tmp/ci | grep -qx 6 && \
          awk -F: '/^cluster_slots_assigned:/{print $2}' /tmp/ci | grep -qx 16384",
        ]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 60s
    networks: [drvalue_bmes_backend_net]

networks:
  drvalue_bmes_backend_net:
    external: true
